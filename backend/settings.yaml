"""
GraphRAG知识图谱构建配置文件
用于配置知识图谱索引构建的各项参数
"""

# 编码模型设置
encoding_model: cl100k_base
skip_workflows: []

# ==================== 大语言模型配置 ====================
llm:
  api_key: ${GRAPHRAG_CHAT_API_KEY}           # API密钥
  type: openai_chat                            # 模型类型
  model: ${GRAPHRAG_CHAT_MODEL}               # 模型名称
  model_supports_json: true                    # 是否支持JSON输出
  max_tokens: 2000                             # 最大token数
  api_base: ${GRAPHRAG_API_BASE}              # API基础地址
  # request_timeout: 180.0                      # 请求超时时间
  # max_retries: 10                             # 最大重试次数
  # concurrent_requests: 25                     # 并发请求数

# ==================== 并行化配置 ====================
parallelization:
  stagger: 0.3                                 # 交错延迟

async_mode: threaded                           # 异步模式：threaded/asyncio

# ==================== 嵌入模型配置 ====================
embeddings:
  async_mode: threaded
  llm:
    api_key: ${GRAPHRAG_EMBEDDING_API_KEY}    # 嵌入API密钥
    type: openai_embedding                     # 嵌入类型
    model: ${GRAPHRAG_EMBEDDING_MODEL}        # 嵌入模型
    api_base: ${GRAPHRAG_API_BASE}            # API基础地址
    # max_retries: 10                           # 最大重试次数
    # batch_size: 16                            # 批处理大小

# ==================== 文本分块配置 ====================
chunks:
  size: 800                                    # 文本块大小（字符）
  overlap: 100                                 # 文本块重叠大小

# ==================== 输入配置 ====================
input:
  type: file                                   # 输入类型
  file_type: text                             # 文件类型
  base_dir: ${GRAPHRAG_INPUT_DIR}             # 输入目录
  file_encoding: utf-8                        # 文件编码
  file_pattern: ".*\\.txt$"                   # 文件匹配模式
  multiple_files: true                        # 是否支持多文件

# ==================== 缓存配置 ====================
cache:
  type: file
  base_dir: ${GRAPHRAG_CACHE_DIR}             # 缓存目录

# ==================== 存储配置 ====================
storage:
  type: file
  base_dir: ${GRAPHRAG_STORAGE_DIR}           # 存储目录

# ==================== 报告配置 ====================
reporting:
  type: file
  base_dir: ${GRAPHRAG_REPORTING_DIR}         # 报告目录

# ==================== 实体提取配置 ====================
entity_extraction:
  prompt: ${GRAPHRAG_ENTITY_EXTRACTION_PROMPT_FILE}  # 提示词文件
  # 实体类型定义（通用版本，不针对特定领域）
  entity_types:
    [
      concept,           # 概念
      topic,             # 主题
      term,              # 术语
      definition,        # 定义
      example,           # 示例
      method,            # 方法
      process,           # 流程
      principle,         # 原理
      theory,            # 理论
      application,       # 应用
      characteristic,    # 特性
      classification,    # 分类
      relationship,      # 关系
      structure,         # 结构
      function,          # 功能
      component,         # 组成部分
      attribute,         # 属性
      standard,          # 标准
      rule,              # 规则
      requirement,       # 要求
      problem,           # 问题
      solution,          # 解决方案
      case,              # 案例
      practice,          # 实践
      tool,              # 工具
      resource,          # 资源
      organization,      # 组织
      person,            # 人物
      event,             # 事件
      time,              # 时间
      location,          # 地点
      document,          # 文档
      reference,         # 参考
    ]
  max_gleanings: 5                             # 最大提取轮数

# ==================== 描述摘要配置 ====================
summarize_descriptions:
  prompt: ${GRAPHRAG_SUMMARIZE_DESCRIPTIONS_PROMPT_FILE}
  max_length: 500                              # 最大长度

# ==================== 声明提取配置 ====================
claim_extraction:
  enabled: true                                # 是否启用
  prompt: ${GRAPHRAG_CLAIM_EXTRACTION_PROMPT_FILE}
  description: 'Any claims or facts that could be relevant to information discovery.'
  max_gleanings: 1

# ==================== 社区报告配置 ====================
community_reports:
  prompt: ${GRAPHRAG_COMMUNITY_REPORT_PROMPT_FILE}
  max_length: 2000                             # 最大长度
  max_input_length: 8000                       # 最大输入长度

# ==================== 图聚类配置 ====================
cluster_graph:
  max_cluster_size: 10                         # 最大聚类大小

# ==================== 图嵌入配置 ====================
embed_graph:
  enabled: false                               # 是否启用节点嵌入

# ==================== UMAP配置 ====================
umap:
  enabled: false                               # 是否启用UMAP降维

# ==================== 快照配置 ====================
snapshots:
  graphml: false
  raw_entities: false
  top_level_nodes: false

# ==================== 本地搜索配置 ====================
local_search:
  # text_unit_prop: 0.5
  # community_prop: 0.1
  # conversation_history_max_turns: 5
  # top_k_mapped_entities: 10
  # top_k_relationships: 10
  # max_tokens: 12000

# ==================== 全局搜索配置 ====================
global_search:
  # llm_temperature: 0
  # llm_top_p: 1
  # max_tokens: 12000
  # data_max_tokens: 12000
  # map_max_tokens: 1000
  # reduce_max_tokens: 2000
  # concurrency: 32
