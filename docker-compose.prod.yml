# ============================================================
# KnowledgeGraph v3.1 — Production Docker Compose
# ============================================================
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kg-backend-prod
    ports:
      - "8013:8013"
    volumes:
      - kg_data:/app/data
      - kg_files:/app/inputs/files
    env_file:
      - backend/.env
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8013
      - CORS_ORIGINS=https://your-domain.com,http://localhost:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Optional: Nginx frontend for built static files
  frontend:
    image: nginx:alpine
    container_name: kg-frontend-prod
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kg_data:
  kg_files:
