version: "3.9"

services:
  backend:
    build: .
    container_name: kg-backend
    ports:
      - "8013:8013"
    volumes:
      - ./backend:/app
      - kg_data:/app/data
      - ./backend/inputs:/app/inputs
    env_file:
      - backend/.env
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8013
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: kg-frontend
    working_dir: /frontend
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/frontend
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  kg_data:
