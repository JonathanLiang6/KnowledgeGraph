[project]
name = "knowledge-graph"
version = "3.0.0"
description = "知识图谱智能问答系统 — 森林绿主题 · D3.js 图谱可视化 · SSE 流式问答"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
