[project]
name = "knowledge-graph"
version = "4.0.0"
description = "个人知识库管理平台 — 拓扑导航 · Agent联网推理 · 多模态感知 · 知识覆盖诊断"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4", "T10", "ARG"]
# v4.1 (#75): 收紧为对本代码库现实合理的规则集 —
# B008: FastAPI Depends() 默认参数惯用法；E501: 长行（宽 120 仍漏网，历史代码多）
# E402: database.py 等刻意在代码后导入模型；N806/N803: ML/图代码用大写缩写变量
# ARG*: 接口/回调保留未用参数属常见签名约束；SIM105/117、B905/B007、UP035: 风格性噪音
ignore = [
  "T10",
  "B008", "E501", "E402", "N806", "N803",
  "ARG001", "ARG002", "ARG003", "ARG004", "ARG005",
  "SIM105", "SIM117", "B905", "B007", "UP035", "S",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
